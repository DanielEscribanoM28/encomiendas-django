{% extends 'base.html' %}

{% block title %}Perfil{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-user-circle me-2"></i>Perfil del empleado</h4>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="text-muted">Usuario</label>
                            <div>{{ user.username }}</div>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted">Correo</label>
                            <div>{{ user.email }}</div>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted">Empleado asociado</label>
                            <div>{% if empleado %}{{ empleado }}{% else %}No encontrado{% endif %}</div>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted">Cargo</label>
                            <div>{% if empleado %}{{ empleado.cargo }}{% else %}-{% endif %}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
