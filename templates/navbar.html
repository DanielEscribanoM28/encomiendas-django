<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            <i class="fas fa-shipping-fast me-2"></i>Encomiendas
        </a>

        {% if user.is_authenticated %}
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                            Dashboard
                            <span class="badge bg-secondary">{{ nav_activas }}</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'encomienda_lista' %}active{% endif %}" href="{% url 'encomienda_lista' %}">
                            Encomiendas
                            {% if nav_retraso > 0 %}
                                <span class="badge bg-danger rounded-pill">{{ nav_retraso }}</span>
                            {% endif %}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'encomienda_crear' %}active{% endif %}" href="{% url 'encomienda_crear' %}">
                            Nueva
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="{% url 'perfil' %}" class="navbar-text text-white text-decoration-none me-3">
                        <i class="fas fa-user me-1"></i>{{ user.username }}
                    </a>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-sign-out-alt me-1"></i>Salir
                    </a>
                </div>
            </div>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-light">
                <i class="fas fa-sign-in-alt me-1"></i>Iniciar sesion
            </a>
        {% endif %}
    </div>
</nav>
